name: Bug Report
description: Report defect đã verify với reproduction step và Evidence đầy đủ.
title: "[BUG][Module] Short description"
labels:
  - "type: bug"
  - "status: new"
body:
  - type: markdown
    attributes:
      value: |
        Chỉ report defect đã verify. Không đưa password, token hoặc secret khác vào issue.
        Dùng title format `[BUG][Module] Short description`.
  - type: textarea
    id: problem-summary
    attributes:
      label: Problem Summary
      description: Mô tả đã test gì, chuyện gì xảy ra và vì sao behavior quan sát được là không đúng.
      placeholder: Mô tả Test Objective và deviation so với Expected Result.
    validations:
      required: true
  - type: input
    id: checklist-item
    attributes:
      label: Related Checklist Item ID
      placeholder: GUI-001 or HR-001
    validations:
      required: true
  - type: input
    id: function-name
    attributes:
      label: Function Name
      placeholder: pLogin, pRegister, or pForgotPassword
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Affected Screen / Module
      options:
        - Login
        - Register
        - Forgot Password
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Ghi browser/version, OS, application URL, version/commit, viewport và test account name nếu cần. Không ghi secret.
      placeholder: |
        Browser:
        Operating system:
        Application URL:
        Version/commit:
        Viewport:
        Test account:
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: Điều kiện, account state, data hoặc navigation state cần có trước reproduction.
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Dùng user action và input data cụ thể, có đánh số.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: Mô tả behavior đúng theo requirement.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: Mô tả chính xác behavior không đúng đã quan sát.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Cung cấp path/link repository-relative đến screenshot, video, console hoặc network Evidence.
      placeholder: task-1-gui-checklist/evidence/failed-items/...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: GitHub label taxonomy; không nhầm impact với urgency.
      options:
        - blocker
        - critical
        - major
        - minor
        - trivial
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: GitHub label taxonomy cho fixing urgency.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: reported-by
    attributes:
      label: Reported By
    validations:
      required: true
  - type: input
    id: assigned-to
    attributes:
      label: Assigned To
      description: Optional. Để trống nếu chưa có assignment rule.
  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Ghi retest information, related issue/PR link hoặc classification rationale.
